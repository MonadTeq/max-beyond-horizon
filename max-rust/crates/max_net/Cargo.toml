[package]
name = "max_net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
max_core = { path = "../max_core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Horizon gRPC (docs/protocol-grpc.md): tonic 0.14 + prost 0.14.
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
sha2 = "0.10"
thiserror = "2"

[build-dependencies]
# Proto codegen. `tonic-prost-build` (not `tonic-build`) owns protobuf
# compilation in tonic 0.14; it still shells out to `protoc`, which we take
# from `protoc-bin-vendored` so no apt/choco install is needed.
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
# Vendored ENet 1.3.18 (vendor/enet) is compiled as a static C library.
cc = "1"

[dev-dependencies]
# Mock Horizon server: serve a tonic router over a `127.0.0.1:0` listener.
tokio-stream = { version = "0.1", features = ["net"] }
