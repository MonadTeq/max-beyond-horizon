[package]
name = "max_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M.A.X. Rust client: core + net + assets + render in one headless-capable application loop"

[dependencies]
max_core = { path = "../max_core" }
max_net = { path = "../max_net" }
max_assets = { path = "../max_assets" }
max_render = { path = "../max_render" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# Окно SDL3 (интерактивный режим): требует системного SDL3 (libsdl3-dev / vcpkg).
sdl = ["max_render/sdl"]
# То же, но SDL3 собирается из исходников (нужен cmake) — путь для CI/docker.
sdl-from-source = ["sdl", "max_render/sdl-from-source"]
