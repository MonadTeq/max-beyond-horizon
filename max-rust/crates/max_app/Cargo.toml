[package]
name = "max_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M.A.X. Rust client: core + net + assets + render in one headless-capable application loop"

# Крейт остаётся `max_app` (библиотеку используют примеры qa_run/qa_golden_check),
# а исполняемый файл клиента называется `max-rust` (max-rust.exe на Windows).
[[bin]]
name = "max-rust"
path = "src/main.rs"

[dependencies]
max_core = { path = "../max_core" }
max_net = { path = "../max_net" }
max_assets = { path = "../max_assets" }
max_render = { path = "../max_render" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Данные `CargoMenu` (93 описания/портрета, `data/cargo_unit_data.json`):
# читаются `include_str!` + serde_json (как ресурс, а не код).
serde.workspace = true
serde_json.workspace = true
# M-NET-доводки: JoinAttemptError (ретрай первого подключения).
thiserror = "2"

# Звук (M6.2): только под feature `sound`, чтобы базовые сборки/CI/докер не
# тянули ALSA/CPAL. Декодер WAV живёт в max_assets и работает всегда.
rodio = { version = "0.19", optional = true, default-features = false }

[features]
# GUI по умолчанию: `cargo run -p max_app` (и обычная сборка) открывает игру.
# `sdl-from-source` самодостаточен — SDL3 3.4.20 собирается из исходников
# (vendored `sdl3-src`) через CMake, без системного SDL3 и без vcpkg; нужны
# только C-компилятор и cmake. Headless-сборки (CI, сервер, `--demo`) собираются
# с `--no-default-features` — тогда SDL не тянется вовсе.
default = ["sdl-from-source"]
# Horizon по TLS (https://) — прокидывает `tls` в max_net. Обычные сборки
# (в т.ч. кросс-сборка Windows) TLS не тянут: Horizon — plaintext http://.
tls = ["max_net/tls"]
# Воспроизведение WAV через rodio/cpal. На Linux нужен libasound2-dev при
# сборке и libasound2 в рантайме; без фичи — тихий no-op backend. НЕ входит в
# default: звук тянет ALSA/WASAPI, а GUI должен собираться и без него.
# Включается явно: `--features sound`.
sound = ["dep:rodio"]
# Окно SDL3 (интерактивный режим) с системным SDL3 (libsdl3-dev / vcpkg).
sdl = ["max_render/sdl"]
# Окно SDL3, собранное из исходников (нужен cmake) — default и путь для CI.
sdl-from-source = ["sdl", "max_render/sdl-from-source"]
# Windows: SDL3 из vcpkg (vcpkg install sdl3:x64-windows, VCPKG_ROOT в env).
# С явными features собирать с `--no-default-features`, иначе к vcpkg
# добавится ещё и default `sdl-from-source`.
sdl-vcpkg = ["sdl", "max_render/sdl-vcpkg"]

[dev-dependencies]
# `start_paused` для тайм-контролируемого теста ретрая первого подключения
# (в обычную сборку не входит: фича включается только в тестовом профиле).
tokio = { workspace = true, features = ["test-util"] }
