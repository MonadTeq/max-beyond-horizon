# M5.3: Horizon (gRPC + WS) + C++ headless max-port with a single command.
#
#   docker compose up --build -d
#   docker compose ps                 # horizon healthy?
#   docker compose logs -f horizon
#   docker compose down
#
# Pragmatic deployment option (chosen out of two): Horizon is not built
# inside the compose image — a ready-made Linux binary is mounted
# ./target/release/horizon. The `deploy/Dockerfile.runtime` image
# is ubuntu:24.04 with the runtime dependencies. If the binary is missing:
#
#   docker compose --profile build run --rm builder
#
# (or see README.Docker.md, the `cargo build --release -p horizon` command).
#
# Ports:
#   8080/tcp  — Horizon WS listener;
#   8082/tcp  — gRPC horizon.v1.Horizon (used by the Rust client);
#   32000-32100/udp — ENet session range for the headless server (max_session).
#
# For games not started from localhost set HORIZON_ANNOUNCE_HOST=<public address>
# (JoinGame returns this host to the client) and forward the same ports in the firewall.
name: max-horizon

services:
  horizon:
    build:
      context: ./deploy
      dockerfile: Dockerfile.runtime
    image: max-horizon-runtime:24.04
    container_name: max-horizon
    restart: unless-stopped
    working_dir: /opt/horizon
    entrypoint: ["/bin/sh", "/opt/horizon/entrypoint.sh"]
    environment:
      HORIZON_ANNOUNCE_HOST: "${HORIZON_ANNOUNCE_HOST:-127.0.0.1}"
      HORIZON_WS_BIND: "0.0.0.0:8080"
      HORIZON_GRPC_BIND: "0.0.0.0:8082"
      MAX_EXECUTABLE: "/opt/max/template/max-port"
      MAX_TEMPLATE_DIR: "/opt/max/template"
      MAX_SESSION_ROOT: "/var/lib/horizon/sessions"
      MAX_GAME_DATA: "/opt/max/game-data"
      MAX_PORT_START: "32000"
      MAX_PORT_END: "32100"
      MAX_RESTARTS: "0"
      MAX_SESSION_SECRET: "${HORIZON_SESSION_SECRET:-smoke-secret}"
      MAX_ADMIN_SECRET: "${HORIZON_ADMIN_SECRET:-smoke-admin}"
    volumes:
      # Ready-made Horizon Linux binary (see `--profile build` below).
      - ./target/release/horizon:/opt/horizon/horizon:ro
      - ./deploy/entrypoint.sh:/opt/horizon/entrypoint.sh:ro
      - ./deploy/horizon.toml.template:/opt/horizon/horizon.toml.template:ro
      # C++ headless: max-port + .so + PATCHES.RES.
      - ${HORIZON_TEMPLATE_DIR:-../bin/linux-server-template}:/opt/max/template:ro
      # MAX.RES; PATCHES.RES must NOT be here (workaround for the headless crash, M5.2).
      - ${HORIZON_GAME_DATA_DIR:-../max-original}:/opt/max/game-data:ro
      # Logs and session working directories stay on the host.
      - ../build/docker-sessions:/var/lib/horizon/sessions
    ports:
      - "${HORIZON_WS_PORT:-8080}:8080"
      - "${HORIZON_GRPC_PORT:-8082}:8082"
      - "32000-32100:32000-32100/udp"
    stop_grace_period: 10s
    # healthcheck is inherited from deploy/Dockerfile.runtime (checking LISTEN
    # 8080/8082 via /proc/net/tcp, without a TCP connect and spurious WS errors).

  # Optional builder (profile `build`). Puts the Linux binary into
  # ./target/release/horizon, which horizon mounts.
  # Run: docker compose --profile build run --rm builder
  builder:
    profiles: ["build"]
    image: rust:1.94.0-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - horizon-cargo-registry:/usr/local/cargo/registry
    command: >
      bash -lc "apt-get update -qq
      && apt-get install -y -qq pkg-config libssl-dev >/dev/null
      && cargo build --release -p horizon
      && ls -lh target/release/horizon"

volumes:
  horizon-cargo-registry:
