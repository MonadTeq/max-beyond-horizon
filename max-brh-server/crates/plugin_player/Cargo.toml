[package]
name = "plugin_player"
version = "0.1.28-alpha"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
# The doc examples were written against an older `PlayerId(u32)` API and do not
# compile with `PlayerId(Uuid)`. Deliberate exclusion for M5.1
# (PLAN-v7-release.md §5.1): unit/integration tests still run. Drop this once the
# examples are refreshed.
doctest = false

[dependencies]
horizon_event_system = { workspace = true }
luminal_rt = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }