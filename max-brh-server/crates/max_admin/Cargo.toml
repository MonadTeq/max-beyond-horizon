[package]
name = "max_admin"
version = "0.1.28-alpha"
edition = "2021"
description = "M.A.X. Port admin plugin for Horizon: programmable admin events (list/status/start/stop/restart sessions) for automation and CLI tooling."

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon_event_system = { path = "../horizon_event_system" }
max_session = { path = "../max_session" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
# Required by the create_simple_plugin! macro expansion (futures::executor::block_on),
# the same way plugin_greeter, plugin_logger and max_lobby need it.
futures = { workspace = true }
