name: CI

# Builds only the game client (max-brh): cargo check + cargo nextest in three
# configs (default GUI/SDL-from-source, +sound, headless), `cargo test --doc` for
# the doctests nextest does not run. The dedicated server (max-brh-server), QA
# golden and soak stages live in ./max-brh-cicd/ci.sh (run locally/Docker), not
# in this workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  max-brh:
    name: max-brh client (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the SDL3 vendored submodule is needed to build the client.
          submodules: max-brh-vendor/SDL

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Install build deps (gcc/cmake for vendored SDL3/ENet, X11/Wayland/ALSA/GL for GUI default)
        # default max_app = ["sdl-from-source"]: SDL3 3.4.20 is built from
        # source via CMake; the dev headers enable the real drivers
        # (X11, Wayland, KMSDRM, ALSA) — without them SDL3 is built with dummy.
        # The set matches max-brh-docs/development/release-checklist.md §2.3.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ cmake pkg-config libasound2-dev \
            libx11-dev libxext-dev libxrender-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libxss-dev libxtst-dev libxfixes-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgles-dev libgl-dev libgbm-dev libdrm-dev \
            libdbus-1-dev libudev-dev

      - name: cargo check
        working-directory: max-brh
        run: cargo check

      # The standard runner is nextest (max-brh-docs/development/test-organization.md,
      # Ar3/Q4/D3). Retries and the timing-sensitive P2P gate overrides live in
      # max-brh/.config/nextest.toml; the `ci` profile also writes JUnit XML
      # (target/nextest/ci/junit.xml), kept per configuration below.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest (default features)
        working-directory: max-brh
        # libSDL3.so.0 is copied from the CMake directory into target/debug; the test
        # binaries need it in LD_LIBRARY_PATH (in artifacts run.sh does this).
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/max-brh/target/debug
        run: |
          cargo nextest run --profile ci
          cp target/nextest/ci/junit.xml target/nextest/junit-default.xml

      - name: cargo test --doc (nextest does not run doctests)
        working-directory: max-brh
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/max-brh/target/debug
        run: cargo test --doc

      - name: cargo check + nextest (feature sound)
        working-directory: max-brh
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/max-brh/target/debug
        run: |
          cargo check --features sound
          cargo nextest run --profile ci --features sound
          cp target/nextest/ci/junit.xml target/nextest/junit-sound.xml
          cargo test --doc --features sound

      - name: cargo nextest (headless, --no-default-features)
        # Console build of the client (no SDL) — a separate cfg set: checks the
        # `main.rs` branches without the `sdl` feature (clear GUI error, --sdl).
        working-directory: max-brh
        run: |
          cargo nextest run --profile ci --no-default-features
          cp target/nextest/ci/junit.xml target/nextest/junit-headless.xml
          cargo test --doc --no-default-features

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          # Per-configuration copies plus the live report of the current (possibly
          # failed) run, which nextest always writes to target/nextest/ci/.
          path: |
            max-brh/target/nextest/junit-*.xml
            max-brh/target/nextest/ci/junit.xml
          if-no-files-found: warn
