# Build configuration for the `max-brh` workspace.
#
# Windows: the main thread has a default PE stack of 1 MiB, and the debug build of the
# headless modes (`--demo`, `--new-game`: save → GameState → ticks) does not fit into it —
# the process dies with `thread 'main' has overflowed its stack`
# (the release build fits through the optimizer, Linux has 8 MiB by default).
# We give the main thread the same 8 MiB: then `cargo run -p max_app --no-default-features
# -- --demo …` works in debug too, and behavior matches Linux.
#
# The flags are set for Windows targets only: nothing changes on Linux/macOS.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
