[workspace]
resolver = "2"
members = [
    # Infrastructure: shared domain/protocol types (phase 5.2); the lowest layer.
    "crates/max_types",
    "crates/max_core",
    "crates/max_net",
    "crates/max_assets",
    "crates/max_render",
    "crates/max_app",
]

# SDL3 vendoring: a local fork of `sdl3-src` (SOURCE_DIR -> max-brh-vendor/SDL),
# so that `sdl-from-source` builds SDL from the git submodule, not from the downloaded crate.
# See max-brh-vendor/README.md.
[patch.crates-io]
sdl3-src = { path = "../max-brh-vendor/sdl3-src-fork" }

[workspace.package]
# Pre-alpha: the owner resets the product version to `0.1.28a` and keeps it below
# 1.0 until the release decision. Cargo requires semver, so the manifest carries
# `0.1.28-alpha`; the displayed form (`0.1.28a`) lives in `max_app::version`.
version = "0.1.28-alpha"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Test tooling (max-brh-docs/development/test-organization.md): `rstest` for
# table-driven tests/fixtures (Ar4/D4), `insta` for snapshots that have no
# golden-frame infrastructure (Ar5/D5). Both are dev-dependencies only.
rstest = "0.29"
insta = "1"
