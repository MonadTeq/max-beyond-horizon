[workspace]
resolver = "2"
members = [
    # Infrastructure: shared domain/protocol types (phase 5.2); the lowest layer.
    "crates/max_types",
    "crates/max_core",
    "crates/max_net",
    "crates/max_assets",
    "crates/max_render",
    "crates/max_app",
]

# SDL3 vendoring: a local fork of `sdl3-src` (SOURCE_DIR -> max-brh-vendor/SDL),
# so that `sdl-from-source` builds SDL from the git submodule, not from the downloaded crate.
# See max-brh-vendor/README.md.
[patch.crates-io]
sdl3-src = { path = "../max-brh-vendor/sdl3-src-fork" }

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
