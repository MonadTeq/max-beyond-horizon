[workspace]
resolver = "2"
members = [
    # Infrastructure: общие доменные/протокольные типы (Ф5.2); ниже всех по слою.
    "crates/max_types",
    "crates/max_core",
    "crates/max_net",
    "crates/max_assets",
    "crates/max_render",
    "crates/max_app",
]

# Вендоринг SDL3: локальный форк `sdl3-src` (SOURCE_DIR -> max-brh-vendor/SDL),
# чтобы `sdl-from-source` собирал SDL из git-сабмодуля, а не из скачанного crate.
# См. max-brh-vendor/README.md.
[patch.crates-io]
sdl3-src = { path = "../max-brh-vendor/sdl3-src-fork" }

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
