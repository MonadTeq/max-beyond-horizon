[package]
name = "max_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M.A.X. Rust client: core + net + assets + render in one headless-capable application loop"

# The crate stays `max_app` (the library is used by the qa_run/qa_golden_check examples),
# while the client executable is named `max-brh` (max-brh.exe on Windows).
[[bin]]
name = "max-brh"
path = "src/main.rs"

[dependencies]
max_core = { path = "../max_core" }
max_net = { path = "../max_net" }
max_assets = { path = "../max_assets" }
max_render = { path = "../max_render" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `CargoMenu` data (93 descriptions/portraits, `data/cargo_unit_data.json`):
# read via `include_str!` + serde_json (as a resource, not as code).
serde.workspace = true
serde_json.workspace = true
# M-NET refinements: JoinAttemptError (retry of the first connection).
thiserror = "2"

# Sound (M6.2): only under the `sound` feature, so that base builds/CI/docker do not
# pull in ALSA/CPAL. The WAV decoder lives in max_assets and always works.
rodio = { version = "0.19", optional = true, default-features = false }

[features]
# GUI by default: `cargo run -p max_app` (and a regular build) opens the game.
# `sdl-from-source` is self-contained — SDL3 3.4.20 is built from source
# (vendored `sdl3-src`) via CMake, without system SDL3 and without vcpkg; only
# a C compiler and cmake are needed. Headless builds (CI, server, `--demo`) are built
# with `--no-default-features` — then SDL is not pulled in at all.
default = ["sdl-from-source"]
# Horizon over TLS (https://) — forwards `tls` to max_net. Regular builds
# (including the Windows cross build) do not pull in TLS: Horizon is plaintext http://.
tls = ["max_net/tls"]
# WAV playback via rodio/cpal. On Linux libasound2-dev is needed at
# build time and libasound2 at runtime; without the feature — a silent no-op backend. NOT part of
# default: sound pulls in ALSA/WASAPI, while the GUI must build without it.
# Enabled explicitly: `--features sound`.
sound = ["dep:rodio"]
# SDL3 window (interactive mode) with system SDL3 (libsdl3-dev / vcpkg).
sdl = ["max_render/sdl"]
# SDL3 window built from source (cmake needed) — default and the path for CI.
sdl-from-source = ["sdl", "max_render/sdl-from-source"]
# Windows: SDL3 from vcpkg (vcpkg install sdl3:x64-windows, VCPKG_ROOT in env).
# With explicit features build with `--no-default-features`, otherwise the default
# `sdl-from-source` is added to vcpkg as well.
sdl-vcpkg = ["sdl", "max_render/sdl-vcpkg"]

[dev-dependencies]
# `start_paused` for the time-controlled test of the first connection retry
# (not part of a regular build: the feature is enabled only in the test profile).
tokio = { workspace = true, features = ["test-util"] }
# Table-driven cases (`#[case]`) in `tests/cursor_table.rs` and
# `tests/preferences_behavior.rs`.
rstest.workspace = true
