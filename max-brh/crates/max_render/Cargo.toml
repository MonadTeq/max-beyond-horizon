[package]
name = "max_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
max_core = { path = "../max_core" }
max_assets = { path = "../max_assets" }
tracing.workspace = true

# SDL3 wrapper — only under the `sdl` feature, so that the clean part of the crate
# builds and is tested without a system SDL3 (see src/sdl_window.rs).
sdl3 = { version = "0.22", optional = true, default-features = false }

[features]
default = []
# Window and frame output: requires an installed SDL3 (libsdl3-dev / vcpkg).
sdl = ["dep:sdl3"]
# The same, but SDL3 is built from source (cmake needed) — the path for CI/docker and
# default `max_app`. Self-contained: `sdl3-sys` builds vendored SDL3 3.4.20
# (`sdl3-src`) via CMake, system SDL3 and vcpkg are not needed. The `sdl3` crate
# also pulls sdl3-sys with its own default features (`use-pkg-config`/`use-vcpkg`),
# but with `build-from-source` enabled build.rs uses the CMake branch ONLY —
# pkg-config/vcpkg are not invoked at all.
sdl-from-source = ["sdl", "sdl3/build-from-source"]
# SDL3 from vcpkg (Windows: vcpkg install sdl3:x64-windows, VCPKG_ROOT in env).
sdl-vcpkg = ["sdl", "sdl3/use-vcpkg"]

[[example]]
name = "window"
required-features = ["sdl"]
