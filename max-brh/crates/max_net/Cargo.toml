[package]
name = "max_net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
max_core = { path = "../max_core" }
# Infrastructure: domain/protocol types (enums/geo/input/team/unit/events/
# victory/UNIT_COUNT) — from the lower layer (phase 5.2). The dependency on `max_core` is
# a deliberate read-only projection of the simulation onto the wire (phase 5.3, option 2): only
# `game`, `crc`, `unit::UnitInfo`, `team::TeamUnits`. `apply_*` and mutations
# of GameState from max_net are forbidden; the CI lock is
# max-brh-cicd/scripts/check_maxnet_boundary.sh.
max_types = { path = "../max_types" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Horizon gRPC (max-brh-docs/protocol-grpc.md): tonic 0.14 + prost 0.14.
#
# Features are pinned explicitly instead of relying on tonic's `default`:
# the Horizon endpoint is plaintext `http://host:port` (horizon.rs), so no
# TLS stack is needed and none must be dragged in implicitly. Keeping the
# default set out of the graph is what makes `x86_64-pc-windows-gnu`
# cross-compilation cheap and free of ring/aws-lc (asm + C toolchain) — and it
# keeps future tonic default bumps from silently re-introducing them.
# `tls` is an opt-in feature (see [features] below) for an `https://` Horizon.
tonic = { version = "0.14", default-features = false, features = [
    "router",
    "transport",
    "codegen",
] }
tonic-prost = "0.14"
prost = "0.14"
sha2 = "0.10"
thiserror = "2"

[build-dependencies]
# Proto codegen. `tonic-prost-build` (not `tonic-build`) owns protobuf
# compilation in tonic 0.14; it still shells out to `protoc`, which we take
# from `protoc-bin-vendored` so no apt/choco install is needed.
# `protoc-bin-vendored` ships a **host** binary, so gRPC codegen runs on the
# build host and is unaffected by cross-compilation to Windows.
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
# Vendored ENet 1.3.18 (vendor/enet) is compiled as a static C library.
# Native Windows builds compile it with MSVC `cl.exe` (max-brh-cicd/scripts/
# build-windows-console.ps1); under `--target x86_64-pc-windows-gnu` `cc`
# would pick `x86_64-w64-mingw32-gcc` instead.
cc = "1"

[features]
default = []
# TLS for Horizon (`https://`) — explicit request only.
#
# Why this feature: Horizon is plaintext right now (`http://`, see src/horizon.rs), while
# rustls/ring/aws-lc are C/asm dependencies that make the Windows-GNU cross build
# and lightweight headless builds pull in a toolchain. By default they are
# absent from the graph; `--features tls` (ring + webpki-roots, pure Rust) enables
# TLS should Horizon ever move to https.
tls = ["tonic/tls-ring", "tonic/tls-webpki-roots"]

[dev-dependencies]
# Mock Horizon server: serve a tonic router over a `127.0.0.1:0` listener.
tokio-stream = { version = "0.1", features = ["net"] }
