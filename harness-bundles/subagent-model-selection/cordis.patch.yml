# Разрешает субагентам выбор модели: сложный анализ — deepseek-v4-pro (Effort Max),
# генерация кода и скриптов — deepseek-v4-flash (DeepSeek-V4.1-Flash).
- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-official
        model: deepseek-v4-pro
      - provider: deepseek-official
        model: deepseek-v4-flash
