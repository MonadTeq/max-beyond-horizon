# Конфиг DOSBox-X для захвата анимаций MAXRUN.EXE (без звука, без дебаггера,
# окно под Xvfb, скриншоты по F11 через mapper).
[sdl]
output        = surface
fullscreen    = false
windowresolution = 640x480
showmenu      = false
autolock      = true
usescancodes  = true

[dosbox]
machine       = svga_s3
memsize       = 64
captures      = /src/build/anim-dos/captures
show recorded filename = false

[render]
frameskip     = 0
aspect        = false
scaler        = none

[cpu]
core          = dynamic
cputype       = pentium
cycles        = fixed 100000

[dos]
xms           = true
ems           = true
umb           = true
keyboardlayout = us

[mixer]
nosound       = true

[midi]
mpu401        = none
mididevice    = none

[sblaster]
sbtype        = none

[gus]
gus           = false

[speaker]
pcspeaker     = false
tandy         = off
disney        = false

[vsync]
vsyncmode     = off

[autoexec]
mount D /src/build/anim-dos/game
D:
CD \MAX
MAXRUN.BAT
