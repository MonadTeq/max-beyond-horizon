# Конфиг DOSBox-X для отладочного прогона MAXRUN.EXE (без звука, с дебаггером).
[sdl]
output=surface

[dosbox]
machine=svga_s3
memsize=64

[dos]
xms=true
ems=true
umb=true

[log]
debuggerrun = debugger

[cpu]
core=normal
cputype=pentium
cycles=fixed 100000

[autoexec]
mount C /src/max-original
C:
DEBUGBOX
MAXRUN.EXE
