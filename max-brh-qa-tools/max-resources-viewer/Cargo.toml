[package]
name = "max-resources-viewer"
version = "0.1.28-alpha"
edition = "2021"
license = "MIT"
description = "M.A.X. MAX.RES viewer/classifier and PNG batch exporter"

# A separate Cargo project (its own Cargo.lock), not part of the max-brh workspace.
[workspace]

[dependencies]
anyhow = "1"
max_assets = { path = "../../max-brh/crates/max_assets" }
max_render = { path = "../../max-brh/crates/max_render" }
sdl3 = { version = "0.22", optional = true, default-features = false }

[features]
default = []
# SDL3 window. The system SDL3 (libsdl3-dev / vcpkg) is located by the linker via
# LIB/PATH (Windows) or pkg-config (Linux). For vcpkg: --features sdl-vcpkg.
sdl = ["dep:sdl3", "sdl3/use-pkg-config"]
sdl-vcpkg = ["sdl", "sdl3/use-vcpkg"]
sdl-from-source = ["sdl", "sdl3/build-from-source"]
