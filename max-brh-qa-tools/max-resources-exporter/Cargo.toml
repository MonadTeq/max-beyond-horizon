[package]
name = "max-resources-exporter"
version = "0.1.28-alpha"
edition = "2021"
license = "MIT"
description = "M.A.X. per-unit asset exporter: sprites, turrets, shadows, connectors, portraits and FLC animations"

# A separate Cargo project (its own Cargo.lock), not part of the max-brh workspace —
# like max-brh-qa-tools/max-resources-viewer. Dependencies are port crates only (path).
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Without `preserve_order` (the feature pulls in indexmap/foldhash, which are not in the offline cache):
# JSON keys go alphabetically — that is deterministic, which is exactly what
# an idempotent export needs.
serde_json = "1"
max_assets = { path = "../../max-brh/crates/max_assets" }
max_core = { path = "../../max-brh/crates/max_core" }
max_render = { path = "../../max-brh/crates/max_render" }

[[bin]]
name = "max-resources-exporter"
path = "src/main.rs"
